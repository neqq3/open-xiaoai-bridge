name: Hermes Final Preview

on:
  push:
    branches:
      - test/hermes-final-preview-f85aa13
  workflow_dispatch:

concurrency:
  group: hermes-final-preview-f85aa13
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/open-xiaoai-bridge
  SOURCE_SHA: f85aa130b2563f12542b63c621383fb157ac8268
  PREVIEW_TAG: hermes-final-f85aa13

jobs:
  validate:
    name: Validate source
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout exact Hermes source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 0

      - name: Fetch upstream baseline
        run: |
          git fetch --no-tags https://github.com/coderzc/open-xiaoai-bridge.git \
            main:refs/remotes/upstream/main

      - name: Verify generic OpenAI files stay upstream-identical
        run: |
          git diff --exit-code upstream/main -- \
            core/openai.py \
            core/openai_conversation.py

      - name: Verify patch formatting
        run: git diff --check upstream/main...HEAD

      - name: Compile Python sources
        run: |
          python3 -m compileall -q -f \
            main.py \
            config.py \
            core \
            tests

  build:
    name: Build ${{ matrix.platform }}
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout exact Hermes source
        uses: actions/checkout@v4
        with:
          ref: ${{ env.SOURCE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: |
            org.opencontainers.image.revision=${{ env.SOURCE_SHA }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=hermes-final-${{ matrix.arch }}
          cache-to: type=gha,scope=hermes-final-${{ matrix.arch }},mode=max

      - name: Verify native extension
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          DIGEST: ${{ steps.build.outputs.digest }}
          EXPECTED_ARCH: ${{ matrix.arch }}
        run: |
          docker pull "${IMAGE}@${DIGEST}"
          docker run --rm \
            --entrypoint /app/.venv/bin/python \
            "${IMAGE}@${DIGEST}" \
            -c "import importlib, platform; native = importlib.import_module('open_xiaoai_server.open_xiaoai_server'); expected = {'amd64': 'x86_64', 'arm64': 'aarch64'}['${EXPECTED_ARCH}']; actual = platform.machine(); assert actual == expected, (actual, expected); assert native.__file__.endswith('.so'), native.__file__; assert hasattr(native, 'start_server'); print('native_extension=' + native.__file__); print('machine=' + actual)"

      - name: Export platform digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload platform digest
        uses: actions/upload-artifact@v4
        with:
          name: hermes-final-digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish multi-arch preview
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      packages: write

    steps:
      - name: Download platform digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: hermes-final-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Create and verify final preview manifest
        id: publish
        working-directory: /tmp/digests
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
        run: |
          sources=()
          for digest_file in *; do
            sources+=("${IMAGE}@sha256:${digest_file}")
          done
          test "${#sources[@]}" -eq 2

          image_ref="${IMAGE}:${PREVIEW_TAG}"
          docker buildx imagetools create -t "${image_ref}" "${sources[@]}"
          docker buildx imagetools inspect "${image_ref}" | tee inspect.txt
          docker buildx imagetools inspect "${image_ref}" --raw > manifest.json

          digest="$(awk '$1 == "Digest:" { print $2; exit }' inspect.txt)"
          test -n "${digest}"

          jq -r '.manifests[] | select(.platform.os != "unknown") | "\(.platform.os)/\(.platform.architecture)"' manifest.json | sort -u > platforms.txt
          printf 'linux/amd64\nlinux/arm64\n' > expected-platforms.txt
          diff -u expected-platforms.txt platforms.txt

          {
            echo "image=${image_ref}"
            echo "digest=${digest}"
            echo "digest_ref=${IMAGE}@${digest}"
            echo "source_commit=${SOURCE_SHA}"
          } | tee preview-image.txt

      - name: Upload preview image record
        uses: actions/upload-artifact@v4
        with:
          name: hermes-final-preview-f85aa13
          path: |
            /tmp/digests/preview-image.txt
            /tmp/digests/manifest.json
            /tmp/digests/platforms.txt
          if-no-files-found: error
          retention-days: 30
